<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSAF Arcadia Developers | Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#000;
            color:#fff;
            font-family:'Poppins',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:500px;
            height:500px;
            background:radial-gradient(circle,#d89a18 0%,transparent 70%);
            opacity:.12;
            filter:blur(40px);
        }

        .container{
            text-align:center;
            z-index:2;
            padding:20px;
        }

        .logo{
            width:320px;
            max-width:80%;
            margin-bottom:40px;
            animation:float 4s ease-in-out infinite;
        }

        h1{
            font-size:52px;
            font-weight:700;
            letter-spacing:4px;
            text-transform:uppercase;
            margin-bottom:18px;
        }

        p{
            font-size:18px;
            color:#cfcfcf;
            max-width:650px;
            margin:auto;
            line-height:1.8;
        }

        .line{
            width:120px;
            height:4px;
            background:#d89a18;
            margin:35px auto;
            border-radius:50px;
        }

        .footer{
            margin-top:45px;
            color:#888;
            font-size:14px;
            letter-spacing:2px;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-12px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        @media(max-width:768px){

            .logo{
                width:240px;
            }

            h1{
                font-size:36px;
            }

            p{
                font-size:16px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="INSAF Arcadia Developers" class="logo">

    <h1>Coming Soon</h1>

    <div class="line"></div>

    <p>
        Our new website is currently under development.
        We're building something exceptional for our clients.
        Stay tuned for an exciting launch.
    </p>

    <div class="footer">
        © 2026 INSAF Arcadia Developers
    </div>

</div>

</body>
</html>
